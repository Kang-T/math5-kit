<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>점대칭 그림판</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#eef3f8;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;overflow:hidden;touch-action:none}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;background:#fff;border-bottom:2px solid #d6e0ea}
h1{font-size:1.1rem;margin:0 12px 0 0;color:#1e3a5f}
button{font:inherit;font-size:1rem;font-weight:700;padding:10px 14px;border-radius:12px;border:2px solid #b8c7d6;background:#fff;color:#1e3a5f;cursor:pointer;min-width:64px}
button.on{background:#1e3a5f;color:#fff;border-color:#1e3a5f}
button.color{min-width:44px;padding:10px}
.sep{width:2px;height:28px;background:#d6e0ea;margin:0 4px}
#hint{width:100%;font-size:1rem;color:#4a6078;margin:0}
#wrap{position:relative;height:calc(100% - 118px)}
canvas{position:absolute;left:0;top:0;width:100%;height:100%}
#tip{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:#fff8d6;border:2px solid #f0c040;border-radius:12px;padding:6px 12px;font-size:1rem;display:none}
</style>
</head>
<body>
<header>
<h1>거울·점대칭 그림판</h1>
<button id="m-draw" class="on">그리기</button>
<button id="m-point">점 찍기</button>
<button id="m-erase">지우개</button>
<span class="sep"></span>
<button class="color on" data-c="#1e3a5f" style="background:#1e3a5f;color:#fff">파랑</button>
<button class="color" data-c="#e05a3a" style="background:#e05a3a;color:#fff">빨강</button>
<button class="color" data-c="#2a9d5c" style="background:#2a9d5c;color:#fff">초록</button>
<span class="sep"></span>
<button id="axis">대칭: 세로</button>
<button id="grid">격자 켜기</button>
<button id="clear">전부 지우기</button>
<p id="hint">한쪽에 그리면 반대쪽에 똑같이 비쳐요. '점 찍기'로 점을 찍으면 짝(대응점)과 거리가 보여요.</p>
</header>
<div id="wrap">
<canvas id="base"></canvas>
<canvas id="ink"></canvas>
<canvas id="top"></canvas>
<div id="tip"></div>
</div>
<script>
(function(){
const G=40; // 격자 1칸 = 40px
const wrap=document.getElementById('wrap');
const base=document.getElementById('base'), ink=document.getElementById('ink'), top=document.getElementById('top');
const tip=document.getElementById('tip');
let W=0,H=0,dpr=1, mode='draw', color='#1e3a5f', sym='v', grid=false, drawing=false, last=null;
let points=[]; // 점 찍기 기록
function resize(){
  dpr=window.devicePixelRatio||1; W=wrap.clientWidth; H=wrap.clientHeight;
  for(const c of [base,ink,top]){ c.width=W*dpr; c.height=H*dpr; c.getContext('2d').setTransform(dpr,0,0,dpr,0,0); }
  drawBase(); drawPoints();
}
const ax=()=>Math.round(W/2/G)*G, ay=()=>Math.round(H/2/G)*G; // 축·중심은 격자선 위에
const vertical=()=>sym==='v';
function mirror(p){ if(sym==='p') return {x:2*ax()-p.x, y:2*ay()-p.y}; return sym==='v'? {x:2*ax()-p.x, y:p.y} : {x:p.x, y:2*ay()-p.y}; }
function drawBase(){
  const c=base.getContext('2d'); c.clearRect(0,0,W,H);
  if(grid){ c.strokeStyle='#d9e2ec'; c.lineWidth=1; c.beginPath();
    for(let x=0;x<=W;x+=G){c.moveTo(x,0);c.lineTo(x,H);} for(let y=0;y<=H;y+=G){c.moveTo(0,y);c.lineTo(W,y);} c.stroke(); }
  c.fillStyle='#f0a020'; c.font='bold 16px sans-serif';
  if(sym==='p'){ c.beginPath(); c.arc(ax(),ay(),9,0,Math.PI*2); c.fill(); c.fillText('대칭의 중심', ax()+14, ay()-12); return; }
  c.strokeStyle='#f0a020'; c.lineWidth=4; c.setLineDash([14,10]); c.beginPath();
  if(sym==='v'){c.moveTo(ax(),0);c.lineTo(ax(),H);} else {c.moveTo(0,ay());c.lineTo(W,ay());} c.stroke(); c.setLineDash([]);
  c.fillText('대칭축', sym==='v'? ax()+8:8, sym==='v'? 22:ay()-8);
}
function stroke(p,q){
  const c=ink.getContext('2d'); c.lineCap='round'; c.lineJoin='round';
  if(mode==='erase'){ c.globalCompositeOperation='destination-out'; c.lineWidth=28; } else { c.globalCompositeOperation='source-over'; c.strokeStyle=color; c.lineWidth=6; }
  for(const [s,e] of [[p,q],[mirror(p),mirror(q)]]){ c.beginPath(); c.moveTo(s.x,s.y); c.lineTo(e.x,e.y); c.stroke(); }
  c.globalCompositeOperation='source-over';
}
function drawPoints(){
  const c=top.getContext('2d'); c.clearRect(0,0,W,H); const a= sym==='h'? ay():ax();
  points.forEach((p,i)=>{
    const q=mirror(p); const same=(p.x===q.x&&p.y===q.y);
    c.setLineDash([8,6]); c.strokeStyle='#555'; c.lineWidth=2; c.beginPath(); c.moveTo(p.x,p.y); c.lineTo(q.x,q.y); c.stroke(); c.setLineDash([]);
    c.fillStyle='#e05a3a'; c.font='bold 18px sans-serif'; c.textAlign='center';
    if(!same && sym==='p'){
      const d=(Math.hypot(p.x-ax(),p.y-ay())/G); const lab=(Math.round(d*10)/10)+'칸';
      c.fillText(lab,(p.x+ax())/2,(p.y+ay())/2-10); c.fillText(lab,(q.x+ax())/2,(q.y+ay())/2-10);
    } else if(!same){
      const v=sym==='v'; const m= v? {x:a,y:p.y}:{x:p.x,y:a}; const s=12, sx= v? (p.x<a?-1:1):1, sy= v?1:(p.y<a?-1:1);
      c.strokeStyle='#e05a3a'; c.lineWidth=2; c.beginPath();
      if(v){ c.moveTo(m.x+sx*s,m.y); c.lineTo(m.x+sx*s,m.y-s); c.lineTo(m.x,m.y-s);} else { c.moveTo(m.x,m.y+sy*s); c.lineTo(m.x+s,m.y+sy*s); c.lineTo(m.x+s,m.y);} c.stroke();
      const d=Math.round((v? Math.abs(p.x-a):Math.abs(p.y-a))/G);
      const l1= v? {x:(p.x+a)/2, y:p.y-10}:{x:p.x+16, y:(p.y+a)/2+6};
      const l2= v? {x:(q.x+a)/2, y:q.y-10}:{x:q.x+16, y:(q.y+a)/2+6};
      c.fillText(d+'칸',l1.x,l1.y); c.fillText(d+'칸',l2.x,l2.y); c.fillText('90°', v? a+(p.x<a?18:-18) : p.x+22, v? p.y-16 : a+(p.y<a?-8:20));
    }
    for(const [pt,lab] of [[p,'점'+(i+1)],[q,'점'+(i+1)+'′']]){ c.fillStyle= pt===p?'#1e3a5f':'#2a9d5c'; c.beginPath(); c.arc(pt.x,pt.y,8,0,Math.PI*2); c.fill(); c.fillStyle='#1e3a5f'; c.font='bold 16px sans-serif'; c.textAlign='left'; c.fillText(lab,pt.x+10,pt.y-10); }
    if(same && i===points.length-1) showTip(sym==='p'? '대칭의 중심 위의 점은 짝이 자기 자신이에요':'대칭축 위의 점은 짝이 자기 자신이에요');
  });
}
let tipT; function showTip(t){ tip.textContent=t; tip.style.display='block'; clearTimeout(tipT); tipT=setTimeout(()=>tip.style.display='none',2500); }
function pos(e){ const r=wrap.getBoundingClientRect(); const t=e.touches? e.touches[0]:e; return {x:t.clientX-r.left, y:t.clientY-r.top}; }
function snap(p){ return {x:Math.round(p.x/G)*G, y:Math.round(p.y/G)*G}; }
function down(e){ e.preventDefault(); const p=pos(e);
  if(mode==='point'){ if(points.length>=6) points.shift(); points.push(snap(p)); drawPoints(); return; }
  drawing=true; last=p; stroke(p,p); }
function move(e){ if(!drawing) return; e.preventDefault(); const p=pos(e); stroke(last,p); last=p; }
function up(){ drawing=false; last=null; }
wrap.addEventListener('mousedown',down); wrap.addEventListener('mousemove',move); window.addEventListener('mouseup',up);
wrap.addEventListener('touchstart',down,{passive:false}); wrap.addEventListener('touchmove',move,{passive:false}); window.addEventListener('touchend',up);
function setMode(m){ mode=m; for(const id of ['draw','point','erase']) document.getElementById('m-'+id).classList.toggle('on',id===m);
  document.getElementById('hint').textContent= m==='point'? (sym==='p'? '점을 찍으면 대칭의 중심을 지나 반대쪽에 짝(대응점)이 생기고, 중심까지의 거리가 보여요. 세 번 찍어 비교해 보세요.':'점을 찍으면 짝(대응점)이 생기고, 대칭축까지의 거리와 만나는 각이 보여요. 세 번 찍어 비교해 보세요.') : m==='erase'? '지우개로 문지르면 양쪽이 같이 지워져요.' : (sym==='p'? '그리면 대칭의 중심을 기준으로 180° 돌린 자리에 똑같이 그려져요.':'한쪽에 그리면 반대쪽에 똑같이 비쳐요.'); }
document.getElementById('m-draw').onclick=()=>setMode('draw');
document.getElementById('m-point').onclick=()=>setMode('point');
document.getElementById('m-erase').onclick=()=>setMode('erase');
document.querySelectorAll('.color').forEach(b=>b.onclick=()=>{ color=b.dataset.c; document.querySelectorAll('.color').forEach(x=>x.classList.remove('on')); b.classList.add('on'); if(mode==='erase') setMode('draw'); });
document.getElementById('axis').onclick=function(){ sym= sym==='v'?'h': sym==='h'?'p':'v'; this.textContent='대칭: '+(sym==='v'?'세로':sym==='h'?'가로':'점대칭'); points=[]; ink.getContext('2d').clearRect(0,0,W,H); drawBase(); drawPoints(); setMode(mode); };
document.getElementById('grid').onclick=function(){ grid=!grid; this.textContent=grid?'격자 끄기':'격자 켜기'; this.classList.toggle('on',grid); drawBase(); };
document.getElementById('clear').onclick=()=>{ points=[]; ink.getContext('2d').clearRect(0,0,W,H); drawPoints(); };
window.addEventListener('resize',resize); resize();
})();
</script>
</body>
</html>
